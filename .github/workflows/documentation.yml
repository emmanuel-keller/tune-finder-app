name: Validate documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build-locales.mjs && node scripts/build-docs.mjs
      - run: node --test tests/*.test.mjs
      - name: Require current generated pages
        run: node scripts/check-generated.mjs
